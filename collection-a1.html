<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a1 'ACCESS' — accinthecloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="cart.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#ffffff; --ink:#0d0d0d; --muted:#909090;
      --border:#ebebeb; --soft:#f5f5f5;
      --serif:'Playfair Display',Georgia,serif;
      --sans:'Inter',-apple-system,sans-serif;
    }
    html { scroll-behavior:smooth; }
    body { font-family:var(--sans); background:var(--bg); color:var(--ink); overflow-x:hidden; }
    a { text-decoration:none; color:inherit; }
    nav {
      position:sticky; top:0; z-index:200; background:rgba(255,255,255,0.92);
      backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
      padding:20px 48px; display:flex; justify-content:space-between; align-items:center;
    }
    .nav-logo { font-family:var(--serif); font-style:italic; font-size:15px; font-weight:300; }
    .nav-center { display:flex; gap:32px; list-style:none; }
    .nav-center a { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); transition:color .3s; }
    .nav-center a:hover, .nav-center a.active { color:var(--ink); }
    .nav-right { display:flex; align-items:center; }
    .cart-link {
      position:relative; display:flex; align-items:center; gap:8px;
      font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
      padding:8px 16px; border:1px solid var(--border); transition:all .2s;
    }
    .cart-link:hover { border-color:var(--ink); }
    .cart-badge {
      display:none; position:absolute; top:-6px; right:-6px;
      width:18px; height:18px; background:var(--ink); color:white;
      font-size:10px; border-radius:50%; align-items:center; justify-content:center;
    }
    #cartFeedback {
      position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--ink); color:white; padding:12px 28px;
      font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
      opacity:0; transition:all .35s; z-index:9999; pointer-events:none;
    }
    #cartFeedback.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .hero {
      padding:80px 48px 56px; border-bottom:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:flex-end; gap:32px;
    }
    .breadcrumb { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:20px; }
    .breadcrumb a { color:var(--muted); }
    .breadcrumb a:hover { color:var(--ink); }
    .hero-title { font-family:var(--serif); font-size:clamp(44px,7vw,84px); font-weight:400; line-height:1; }
    .hero-sub { font-size:13px; color:var(--muted); margin-top:10px; font-style:italic; }
    .hero-right { text-align:right; flex-shrink:0; }
    .hero-info { font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); line-height:2; }
    .hero-info strong { color:var(--ink); }
    .capsule-cover { width:100%; max-height:70vh; overflow:hidden; }
    .capsule-cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .products { padding:2px 48px 120px; }
    .products-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding-top:2px; }
    .product-card { cursor:pointer; }
    /* card scroll gallery */
    .card-gallery {
      overflow-x:auto; display:flex; gap:2px;
      scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
      cursor:grab;
    }
    .card-gallery::-webkit-scrollbar { display:none; }
    .card-gallery .slide {
      flex:0 0 100%; scroll-snap-align:start;
      aspect-ratio:3/4; overflow:hidden; background:var(--soft);
    }
    .card-gallery .slide img,
    .card-gallery .slide .ph {
      width:100%; height:100%; object-fit:cover;
      transition:transform .8s cubic-bezier(.25,.46,.45,.94);
    }
    .product-card:hover .card-gallery .slide img,
    .product-card:hover .card-gallery .slide .ph { transform:scale(1.03); }
    /* dot indicators */
    .card-dots { display:flex; gap:5px; padding:8px 0 0; }
    .card-dot { width:5px; height:5px; border-radius:50%; background:var(--border); transition:background .2s; }
    .card-dot.active { background:var(--ink); }
    .card-info { padding:16px 0 0; }
    .card-type { font-size:9px; letter-spacing:0.24em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .card-name { font-size:17px; font-weight:400; margin-bottom:6px; }
    .card-price { font-size:13px; margin-bottom:10px; }
    .card-desc { font-size:12px; color:var(--muted); line-height:1.7; }
    .card-cta {
      display:inline-block; margin-top:16px; margin-bottom:32px;
      font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
      border-bottom:1px solid var(--ink); padding-bottom:2px; transition:opacity .2s;
    }
    .product-card:hover .card-cta { opacity:.5; }
    .modal-overlay {
      position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.5);
      backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .35s;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:var(--bg); width:100%; max-width:860px; max-height:90vh;
      overflow-y:auto; display:grid; grid-template-columns:1fr 1fr;
      transform:translateY(32px); transition:transform .4s cubic-bezier(.25,.46,.45,.94);
      position:relative;
    }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-close {
      position:absolute; top:20px; right:20px; z-index:10;
      width:36px; height:36px; display:flex; align-items:center; justify-content:center;
      background:white; border:1px solid var(--border); cursor:pointer; font-size:16px;
    }
    .modal-img { position:sticky; top:0; min-height:400px; background:var(--soft); overflow:hidden; }
    .modal-img img, .modal-img .ph { width:100%; height:100%; min-height:500px; object-fit:cover; }
    .modal-body { padding:40px 36px; }
    .modal-tag { font-size:9px; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
    .modal-name { font-family:var(--serif); font-size:26px; font-weight:400; margin-bottom:6px; }
    .modal-price { font-size:18px; margin-bottom:4px; }
    .modal-price-usd { font-size:12px; color:var(--muted); margin-bottom:20px; }
    .modal-divider { height:1px; background:var(--border); margin-bottom:24px; }
    .mfield { margin-bottom:22px; }
    .mfield label { display:block; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
    .color-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:8px; }
    .color-cell { aspect-ratio:1; border:2px solid transparent; cursor:pointer; transition:all .2s; border-radius:2px; }
    .color-cell:hover { transform:scale(1.12); }
    .color-cell.sel { border-color:var(--ink); }
    .color-label { font-size:11px; color:var(--muted); min-height:16px; }
    .variant-grid { display:flex; flex-wrap:wrap; gap:6px; }
    .var-btn {
      padding:7px 14px; border:1px solid var(--border); font-family:var(--sans);
      font-size:11px; cursor:pointer; background:transparent; transition:all .2s;
    }
    .var-btn:hover { border-color:var(--ink); }
    .var-btn.sel { background:var(--ink); color:white; border-color:var(--ink); }
    .var-btn.sold { opacity:.35; cursor:not-allowed; text-decoration:line-through; }
    .mfield input, .mfield textarea {
      width:100%; padding:11px 0; border:none; border-bottom:1px solid var(--border);
      background:transparent; font-family:var(--sans); font-size:13px; outline:none; transition:border-color .3s;
    }
    .mfield input:focus, .mfield textarea:focus { border-bottom-color:var(--ink); }
    .mfield textarea { resize:none; line-height:1.6; }
    .qty-row { display:flex; align-items:center; margin-bottom:20px; }
    .qty-btn {
      width:36px; height:36px; border:1px solid var(--border); background:transparent;
      font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s;
    }
    .qty-btn:hover { background:var(--soft); }
    .qty-val { width:44px; text-align:center; font-size:14px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); height:36px; line-height:36px; }
    .btn-cart {
      width:100%; padding:16px; background:var(--ink); color:white; border:none;
      font-family:var(--sans); font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
      cursor:pointer; transition:opacity .3s;
    }
    .btn-cart:hover { opacity:.75; }
    .modal-note { font-size:10px; color:var(--muted); text-align:center; margin-top:10px; }
    footer { padding:40px 48px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .footer-logo { font-family:var(--serif); font-style:italic; font-size:14px; }
    .footer-links { display:flex; gap:24px; }
    .footer-links a { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); transition:color .3s; }
    .footer-links a:hover { color:var(--ink); }
    .reveal { opacity:0; transform:translateY(24px); }
    @media(max-width:900px) {
      nav { padding:16px 20px; }
      .nav-center { display:none; }
      .hero { padding:60px 20px 40px; flex-direction:column; gap:20px; }
      .hero-right { text-align:left; }
      .products { padding:2px 20px 80px; }
      .products-grid { grid-template-columns:1fr; }
      .modal { grid-template-columns:1fr; }
      .modal-img { min-height:260px; position:relative; }
      .modal-body { padding:28px 20px; }
      footer { flex-direction:column; gap:16px; text-align:center; }
    }
  </style>
</head>
<body>
<div id="cartFeedback">Добавлено в корзину ✓</div>
<nav>
  <a href="index.html" class="nav-logo">accinthecloud</a>
  <ul class="nav-center">
    <li><a href="lookbook.html">Lookbook</a></li>
    <li><a href="collection-a1.html" class="active">a1</a></li>
    <li><a href="collection-a2.html">a2</a></li>
    <li><a href="collection-a3.html">a3</a></li>
  </ul>
  <div class="nav-right">
    <a href="cart.html" class="cart-link">Корзина <span class="cart-badge"></span></a>
  </div>
</nav>
<div class="hero reveal">
  <div>
    <p class="breadcrumb"><a href="index.html">accinthecloud</a> / Capsule a1</p>
    <h1 class="hero-title">'ACCESS'</h1>
    <p class="hero-sub">Shoulder bag &mdash; Capsule a1</p>
  </div>
  <div class="hero-right">
    <div class="hero-info">
      <strong>Pre-order open</strong><br>
      Free shipping &middot; Russia<br>
      Release &mdash; 15.08.25
    </div>
  </div>
</div>
<div class="capsule-cover">
  <img src="images/a1/bunch.jpeg" alt="ACCESS Capsule a1" />
</div>
<div class="products">
  <div class="products-grid" id="grid"></div>
</div>
<div class="modal-overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="mClose">&#10005;</button>
    <div class="modal-img">
      <div class="ph" id="mImg" style="background:var(--soft);"></div>

    <div class="modal-body">
      <p class="modal-tag" id="mTag"></p>
      <h2 class="modal-name" id="mName"></h2>
      <p class="modal-price" id="mPrice"></p>

      <div class="modal-divider"></div>
      <div id="secClassic" style="display:none;">
        <div class="mfield">
          <label>Выбери цвет (1&ndash;16)</label>

          <p class="color-label" id="colorLabel"></p>

      <div id="secUnique" style="display:none;">
        <div class="mfield">
          <label>Вариант</label>
          <div class="variant-grid" id="varGrid"></div>
        </div>
      </div>
      <div id="secCustom" style="display:none;">
        <div class="mfield">
          <label>Опиши свою идею</label>
          <textarea id="inputCustom" rows="4" placeholder="Материал, цвет, детали, референсы..."></textarea>
        </div>

      <div class="mfield">
        <label>Дополнительные пожелания</label>

      </div>
      <div class="qty-row">
        <button class="qty-btn" id="qMinus">&#8722;</button>
        <div class="qty-val" id="qVal">1</div>

      </div>
      <button class="btn-cart" id="btnCart">Добавить в корзину</button>
      <p class="modal-note">Бесплатная доставка по России</p>
    </div>
  </div>
</div>
<footer>
  <span class="footer-logo">accinthecloud</span>
  <div class="footer-links">
    <a href="index.html">Главная</a>
    <a href="https://t.me/accinthecloud1" target="_blank">Telegram</a>
    <a href="https://instagram.com/accinthecloud" target="_blank">Instagram</a>
  </div>
</footer>
<script>
const CAPSULE = "Capsule a1 · ACCESS";
const COLORS = [
  {n:1,name:'Dark Navy',hex:'#2c2d35'},{n:2,name:'Cream',hex:'#e8e0d0'},
  {n:3,name:'Navy Blue',hex:'#1e2d4a'},{n:4,name:'Charcoal',hex:'#3a3a3a'},
  {n:5,name:'Army Olive',hex:'#5a5c4a'},{n:6,name:'Brown',hex:'#7a5c48'},
  {n:7,name:'Camel',hex:'#b89070'},{n:8,name:'Mauve',hex:'#9a7080'},
  {n:9,name:'Slate Grey',hex:'#8a8a8a'},{n:10,name:'Sand',hex:'#c8b090'},
  {n:11,name:'Light Grey',hex:'#b0b0b0'},{n:12,name:'Graphite',hex:'#4a4a4a'},
  {n:13,name:'Silver',hex:'#c8c8c8'},{n:14,name:'Limestone',hex:'#d8d0c0'},
  {n:15,name:'Steel Blue',hex:'#7090b0'},{n:16,name:'B&W Stripe',hex:'linear-gradient(90deg,#222 50%,#e8e8e8 50%)'},
];
const UNIQUES = [
  {name:'Texas',sold:true},{name:'Camo',sold:true},{name:'Grey TR',sold:true},
  {name:'Jeans',sold:true},{name:'Carhartt',sold:true},{name:'Limestone',sold:true},
  {name:'Black',sold:true},{name:'Stripe',sold:true},{name:'Beige',sold:true},
];
const PRODUCTS = [
  {
    id:'a1-classic', type:'classic',
    name:'ACCESS Classic', typeLabel:'Pre-order · 16 цветов',
    price:'4 500 &#8381;', priceUsd:'60$', priceNum:4500,
    desc:'Классическая сумка ручного пошива. Предзаказ на любой из 16 цветов. Доступные цвета: Limestone #14, Black, Stripe, Beige — sold. Все 16 цветов открыты для предзаказа.',
    cta:'Выбрать цвет &#8594;',
    /* ИНСТРУКЦИЯ: bg:'url("images/a1/classic-all.jpg") center/cover' */
    bg:'url("images/a1/classic.jpeg") center/cover',
    thumbs:['url("images/a1/classic p.jpeg") center/cover','url("images/a1/colours classic.jpeg") center/cover'],
  },
  {
    id:'a1-unique', type:'unique',
    name:'ACCESS Unique', typeLabel:'Unique · Ваш дизайн',
    price:'7 500 &#8381;', priceUsd:'100$', priceNum:7500,
    desc:'Из переработанных материалов. Каждая сумка в одном экземпляре. Texas, Camo, Grey TR, Jeans, Carhartt — sold. Новые варианты появляются постоянно — следи в Telegram.',
    cta:'Посмотреть варианты &#8594;',
    bg:'url("images/a1/unique.jpeg") center/cover',
    thumbs:['url("images/a1/unique p.jpeg") center/cover'],
  },
  {
    id:'a1-custom', type:'custom',
    name:'Make Your Own', typeLabel:'Кастом · Своя идея',
    price:'от 4 500 &#8381;', priceUsd:'from 60$', priceNum:4500,
    desc:'Ты придумываешь — я шью. Свой материал, свой цвет, своя идея. Обсуждаем детали в Telegram, определяем цену и сроки индивидуально.',
    cta:'Описать идею &#8594;',
    bg:'linear-gradient(160deg,#e8e4e0,#d8d4d0)',
    thumbs:[],
  },
];

const grid = document.getElementById('grid');
PRODUCTS.forEach(p => {
  const card = document.createElement('div');
  card.className = 'product-card reveal';

  // all images: main + thumbs
  const allImgs = [p.bg, ...(p.thumbs||[])];
  const slidesHtml = allImgs.map(src => {
    const isUrl = src.startsWith('url(');
    return `<div class="slide">${isUrl
      ? `<img src="${src.replace(/url\(["']?|["']?\)/g,'')}" loading="lazy" alt="">`
      : `<div class="ph" style="background:${src};"></div>`
    }</div>`;
  }).join('');

  const dotsHtml = allImgs.length > 1
    ? `<div class="card-dots">${allImgs.map((_,i)=>`<div class="card-dot${i===0?' active':''}"></div>`).join('')}</div>`
    : '';

  card.innerHTML = `
    <div class="card-gallery" data-gallery>${slidesHtml}</div>
    ${dotsHtml}
    <div class="card-info">
      <p class="card-type">${p.typeLabel}</p>
      <p class="card-name">${p.name}</p>
      <p class="card-price">${p.price} / ${p.priceUsd}</p>
      <p class="card-desc">${p.desc}</p>
      <span class="card-cta">${p.cta}</span>
    </div>`;

  // sync dots on scroll
  const gallery = card.querySelector('[data-gallery]');
  const dots = card.querySelectorAll('.card-dot');
  if (dots.length) {
    gallery.addEventListener('scroll', () => {
      const idx = Math.round(gallery.scrollLeft / gallery.offsetWidth);
      dots.forEach((d,i) => d.classList.toggle('active', i===idx));
    }, {passive:true});
  }

  // drag to scroll
  let isDown=false, startX, scrollLeft;
  gallery.addEventListener('mousedown', e=>{isDown=true;startX=e.pageX-gallery.offsetLeft;scrollLeft=gallery.scrollLeft;});
  gallery.addEventListener('mouseleave',()=>isDown=false);
  gallery.addEventListener('mouseup',()=>isDown=false);
  gallery.addEventListener('mousemove',e=>{if(!isDown)return;e.preventDefault();const x=e.pageX-gallery.offsetLeft;gallery.scrollLeft=scrollLeft-(x-startX)*1.5;});

  card.addEventListener('click', e=>{
    if(!e.target.closest('[data-gallery]')) openModal(p);
    else {
      // tap to advance slide
      const rect=gallery.getBoundingClientRect();
      const half=rect.width/2;
      const clickX=e.clientX-rect.left;
      if(clickX>half) gallery.scrollBy({left:gallery.offsetWidth,behavior:'smooth'});
      else gallery.scrollBy({left:-gallery.offsetWidth,behavior:'smooth'});
    }
  });

  grid.appendChild(card);
});

document.addEventListener('DOMContentLoaded', ()=>{
  gsap.to('.reveal',{opacity:1,y:0,duration:.8,stagger:.1,ease:'power2.out',delay:.1});
});

let cur=null, qty=1, selColor=null, selVariant='';

function openModal(p){
  cur=p; qty=1; selColor=null; selVariant='';
  document.getElementById('mImg').style.background=p.bg;
  document.getElementById('mTag').textContent=CAPSULE;
  document.getElementById('mName').innerHTML=p.name;
  document.getElementById('mPrice').innerHTML=p.price;
  document.getElementById('mPriceUsd').textContent=p.priceUsd;
  document.getElementById('qVal').textContent=1;
  document.getElementById('inputNotes').value='';
  document.getElementById('inputCustom').value='';
  document.getElementById('secClassic').style.display='none';
  document.getElementById('secUnique').style.display='none';
  document.getElementById('secCustom').style.display='none';
  if(p.type==='classic'){
    document.getElementById('secClassic').style.display='block';
    const cg=document.getElementById('colorGrid');
    cg.innerHTML=''; selColor=null;
    document.getElementById('colorLabel').textContent='';
    COLORS.forEach(c=>{
      const cell=document.createElement('div');
      cell.className='color-cell';
      cell.style.background=c.hex;
      cell.title=`${c.n}. ${c.name}`;
      cell.addEventListener('click',()=>{
        cg.querySelectorAll('.color-cell').forEach(x=>x.classList.remove('sel'));
        cell.classList.add('sel'); selColor=c;
        document.getElementById('colorLabel').textContent=`${c.n}. ${c.name}`;
      });
      cg.appendChild(cell);
    });
  } else if(p.type==='unique'){
    document.getElementById('secUnique').style.display='block';
    const vg=document.getElementById('varGrid');
    vg.innerHTML=''; selVariant='';
    UNIQUES.forEach(v=>{
      const btn=document.createElement('button');
      btn.className='var-btn'+(v.sold?' sold':'');
      btn.textContent=v.sold?v.name+' (sold)':v.name;
      btn.disabled=v.sold;
      if(!v.sold){btn.addEventListener('click',()=>{vg.querySelectorAll('.var-btn').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');selVariant=v.name;});}
      vg.appendChild(btn);
    });
  } else {
    document.getElementById('secCustom').style.display='block';
  }
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}

document.getElementById('mClose').addEventListener('click',closeModal);
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('qMinus').addEventListener('click',()=>{if(qty>1){qty--;document.getElementById('qVal').textContent=qty;}});
document.getElementById('qPlus').addEventListener('click',()=>{if(qty<9){qty++;document.getElementById('qVal').textContent=qty;}});
document.getElementById('btnCart').addEventListener('click',()=>{
  const notes=document.getElementById('inputNotes').value.trim();
  let color='';
  if(cur.type==='classic') color=selColor?`Color #${selColor.n} - ${selColor.name}`:'';
  else if(cur.type==='unique') color=selVariant;
  else color=document.getElementById('inputCustom').value.trim();
  ACC.add({id:cur.id,capsule:CAPSULE,name:cur.name,price:cur.price,priceNum:cur.priceNum,size:'',color,notes,qty,bg:cur.bg});
  closeModal();
});
</script>
</body>
</html>
