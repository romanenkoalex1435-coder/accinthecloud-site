<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — accinthecloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --ink: #0d0d0d;
      --muted: #909090;
      --border: #e8e8e8;
      --green: #22c55e;
      --red: #ef4444;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh;
    }

    /* ─── Login ── */
    #loginScreen {
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 24px;
    }
    .login-box {
      width: 320px; background: var(--card); padding: 40px;
      border: 1px solid var(--border);
    }
    .login-logo {
      font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 32px; display: block;
    }
    .login-box label {
      display: block; font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .login-box input {
      width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid var(--border);
      background: transparent; font-family: inherit; font-size: 14px; outline: none;
      transition: border-color 0.3s;
    }
    .login-box input:focus { border-bottom-color: var(--ink); }
    .login-btn {
      width: 100%; padding: 14px; margin-top: 24px;
      background: var(--ink); color: white; border: none;
      font-family: inherit; font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; cursor: pointer;
    }
    .login-error {
      font-size: 12px; color: var(--red); margin-top: 12px;
      display: none;
    }
    .login-error.show { display: block; }

    /* ─── Dashboard ── */
    #dashboard { display: none; }
    .top-bar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 20px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .top-bar-left { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }
    .top-bar-right { display: flex; align-items: center; gap: 24px; }
    .tg-status {
      font-size: 11px; display: flex; align-items: center; gap: 6px; color: var(--muted);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    .dot.offline { background: var(--muted); animation: none; }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .logout-btn {
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      background: none; border: 1px solid var(--border); padding: 8px 16px;
      cursor: pointer; color: var(--muted); transition: all 0.2s;
    }
    .logout-btn:hover { border-color: var(--ink); color: var(--ink); }

    .main { max-width: 960px; margin: 0 auto; padding: 40px 32px; }

    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 40px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); padding: 24px;
    }
    .stat-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 300; }

    .section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .section-head h2 { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .clear-btn {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 4px 0;
    }
    .clear-btn:hover { color: var(--red); }
    .refresh-btn {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 4px 8px; transition: color .2s;
    }
    .refresh-btn:hover { color: var(--ink); }

    .orders-list { display: flex; flex-direction: column; gap: 8px; }
    .order-card {
      background: var(--card); border: 1px solid var(--border); padding: 24px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: start;
    }
    .order-num {
      font-size: 11px; color: var(--muted); padding-top: 2px; min-width: 28px;
    }
    .order-body {}
    .order-type {
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
    }
    .order-details { font-size: 14px; margin-bottom: 8px; line-height: 1.5; }
    .order-meta { font-size: 12px; color: var(--muted); }
    .order-meta span { margin-right: 16px; }
    .order-time { font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }

    .empty-state {
      text-align: center; padding: 80px 0; color: var(--muted);
    }
    .empty-state p { font-size: 14px; margin-bottom: 8px; }
    .empty-state small { font-size: 11px; }

    .tg-notice {
      background: var(--card); border: 1px solid var(--border); padding: 20px 24px;
      font-size: 12px; line-height: 1.7; color: var(--muted); margin-top: 32px;
    }
    .tg-notice strong { color: var(--ink); display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    .tg-notice a { color: var(--ink); text-decoration: underline; }

    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .order-card { grid-template-columns: 1fr; gap: 8px; }
      .order-time { text-align: left; }
    }
  </style>
</head>
<body>

<!-- ─── LOGIN ─────────────────────────────────────────── -->
<div id="loginScreen">
  <div class="login-box">
    <span class="login-logo">accinthecloud · Admin</span>
    <label>Email</label>
    <input type="email" id="emailInput" placeholder="admin@accinthecloud.ru" autocomplete="username" />
    <label style="margin-top:20px;">Пароль</label>
    <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password" />
    <div class="login-error" id="loginError">Неверный email или пароль</div>
    <button class="login-btn" onclick="tryLogin()">Войти</button>
  </div>
</div>

<!-- ─── DASHBOARD ─────────────────────────────────────── -->
<div id="dashboard">
  <div class="top-bar">
    <div class="top-bar-left">accinthecloud · Заявки</div>
    <div class="top-bar-right">
      <div class="tg-status">
        <div class="dot" id="tgDot"></div>
        <span id="tgLabel">Supabase</span>
      </div>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="main">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Всего заявок</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Из корзины</div>
        <div class="stat-value" id="statCart">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Инд. пошив</div>
        <div class="stat-value" id="statCustom">0</div>
      </div>
    </div>

    <div class="section-head">
      <h2>Заявки</h2>
      <div style="display:flex;gap:12px;align-items:center;">
        <button class="refresh-btn" onclick="loadOrders()">↻ Обновить</button>
        <button class="clear-btn" onclick="clearOrders()">Очистить всё</button>
      </div>
    </div>

    <div class="orders-list" id="ordersList"></div>

    <div class="tg-notice">
      <strong>База данных</strong>
      Все заявки хранятся в Supabase. Для доступа к таблице напрямую:
      <a href="https://supabase.com/dashboard/project/tllrnkcmjvfspwrlcvbg/editor" target="_blank">открыть Table Editor</a>.
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1"></script>
<script>
// ── Supabase ──
const { createClient } = supabase;
const _sb = createClient(
  'https://tllrnkcmjvfspwrlcvbg.supabase.co',
  'sb_publishable_B7l8wH4rW7Wllj9ueEKOQg_Hxk3JKGS'
);

async function tryLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;
  const { error } = await _sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('loginError').classList.add('show');
  } else {
    document.getElementById('loginError').classList.remove('show');
    showDashboard();
  }
}
['emailInput','passInput'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
});

async function logout() {
  await _sb.auth.signOut();
  location.reload();
}

async function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  await loadOrders();
  checkSupabase();
}

(async () => {
  const { data: { session } } = await _sb.auth.getSession();
  if (session) showDashboard();
})();

const STATUS_COLOR = { new: '#f59e0b', 'in-progress': '#3b82f6', done: '#22c55e' };

async function loadOrders() {
  const list = document.getElementById('ordersList');
  list.innerHTML = '<div class="empty-state"><p style="opacity:.4">Загрузка...</p></div>';

  const { data: orders, error } = await _sb
    .from('orders')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    list.innerHTML = `<div class="empty-state"><p>Ошибка загрузки</p><small>${escHtml(error.message)}</small></div>`;
    return;
  }

  document.getElementById('statTotal').textContent  = orders.length;
  document.getElementById('statCart').textContent   = orders.filter(o => o.type === 'cart').length;
  document.getElementById('statCustom').textContent = orders.filter(o => o.type !== 'cart').length;

  if (orders.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <p>Заявок пока нет</p>
        <small>Появятся здесь после оформления заказа на сайте</small>
      </div>`;
    return;
  }

  list.innerHTML = orders.map((o, i) => {
    const isCart = o.type === 'cart';
    const typeLabel = isCart ? '🛒 Корзина' : '✍️ Инд. пошив';
    let detailsHtml = '';

    if (isCart && o.items && o.items.length) {
      detailsHtml = o.items.map(item => {
        const qty = item.qty || 1;
        const meta = [];
        if (item.size)  meta.push('Размер: ' + item.size);
        if (item.color) meta.push('Цвет/ткань: ' + item.color);
        if (item.notes) meta.push(item.notes);
        return `
          <div style="padding:8px 0;border-bottom:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;">
              <span style="font-size:13px;font-weight:500;">${escHtml(item.name)}</span>
              <span style="font-size:13px;white-space:nowrap;margin-left:16px;">${escHtml(item.price)}${qty > 1 ? ' × ' + qty : ''}</span>
            </div>
            <div style="font-size:11px;color:var(--muted);">${escHtml(item.capsule)}${meta.length ? ' · ' + meta.join(' · ') : ''}</div>
          </div>`;
      }).join('');
    } else if (o.notes) {
      detailsHtml = `<div style="font-size:13px;line-height:1.7;">${escHtml(o.notes).replace(/\n/g,'<br>')}</div>`;
    }

    const status = o.status || 'new';
    const color  = STATUS_COLOR[status] || STATUS_COLOR.new;
    const ts = new Date(o.created_at).toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
    });

    return `
    <div class="order-card" id="oc-${o.id}">
      <div class="order-num">#${orders.length - i}</div>
      <div class="order-body">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <div class="order-type">${typeLabel}</div>
          <select class="status-sel" data-id="${o.id}"
            style="border:1px solid ${color};color:${color};background:transparent;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:2px 8px;outline:none;cursor:pointer;font-family:inherit;border-radius:0;">
            <option value="new"         ${status==='new'         ?'selected':''}>Новая</option>
            <option value="in-progress" ${status==='in-progress' ?'selected':''}>В работе</option>
            <option value="done"        ${status==='done'        ?'selected':''}>Готово</option>
          </select>
        </div>
        <div style="margin:8px 0;">${detailsHtml}</div>
        <div class="order-meta">
          <span>👤 ${escHtml(o.name || '')}</span>
          <span>✈️ <a href="https://t.me/${(o.contact||'').replace('@','')}" target="_blank" style="color:var(--ink)">${escHtml(o.contact || '')}</a></span>
          ${o.notes && isCart ? `<span>💬 ${escHtml(o.notes)}</span>` : ''}
        </div>
      </div>
      <div class="order-time">${ts}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('.status-sel').forEach(sel => {
    sel.addEventListener('change', async function() {
      const id = this.dataset.id;
      const s  = this.value;
      const c  = STATUS_COLOR[s] || STATUS_COLOR.new;
      this.style.borderColor = c;
      this.style.color = c;
      await _sb.from('orders').update({ status: s }).eq('id', id);
    });
  });
}

async function clearOrders() {
  if (!confirm('Удалить все заявки? Это нельзя отменить.')) return;
  const { error } = await _sb.from('orders').delete().neq('id', 0);
  if (error) { alert('Ошибка: ' + error.message); return; }
  loadOrders();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function checkSupabase() {
  const dot   = document.getElementById('tgDot');
  const label = document.getElementById('tgLabel');
  try {
    const { error } = await _sb.from('orders').select('id').limit(1);
    if (!error) {
      label.textContent = 'Supabase online';
    } else {
      dot.classList.add('offline');
      label.textContent = 'Supabase (ошибка)';
    }
  } catch {
    dot.classList.add('offline');
    label.textContent = 'Supabase (недоступен)';
  }
}
</script>
</body>
</html>
