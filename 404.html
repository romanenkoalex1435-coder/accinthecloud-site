<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/js/i18n.js?v=12"></script>
  <title>Страница порвалась — accinthecloud</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="accinthecloud">
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" href="/fonts/PixelImpacted.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* 404: страница порвалась, её можно зашить иголкой */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    @font-face {
      font-family: "PixelImpacted";
      src: url("/fonts/PixelImpacted.woff2") format("woff2");
      unicode-range: U+0020-007E, U+00A0-00FF, U+0400-04FF, U+2010-2027, U+20BD, U+2116;
      font-display: swap;
    }
    :root {
      --ink:#0d0d0d; --muted:#6b6b6b; --line:#d9d9d9; --table:#f1f1f1;
      --pixel:'PixelImpacted',-apple-system,sans-serif;
    }
    html { background:#fff; }
    body {
      min-height:100vh; display:flex; flex-direction:column;
      font-family:'Inter',-apple-system,sans-serif; font-weight:400;
      background:#fff; color:var(--ink); overflow-x:hidden;
    }

    /* шапка как на сайте: логотип слева, выход на главную всегда виден */
    .top {
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:16px 24px; border-bottom:1px solid var(--line);
    }
    .top-logo { display:inline-flex; align-items:center; min-height:44px; }
    .top-logo img { width:120px; height:auto; display:block; }

    .btn {
      display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 22px;
      border:1px solid var(--ink); background:#fff; color:var(--ink); text-decoration:none; cursor:pointer;
      font:inherit; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; white-space:nowrap;
      transition:background-color .18s ease, color .18s ease;
    }
    .btn:hover { background:var(--ink); color:#fff; }
    .btn:active { background:#2a2a2a; color:#fff; }
    .btn-solid { background:var(--ink); color:#fff; }
    .btn-solid:hover { background:#fff; color:var(--ink); }

    main { flex:1; display:flex; flex-direction:column; align-items:center; padding:28px 24px 40px; gap:22px; }

    /* поле игры: здесь гасим прокрутку пальцем, больше нигде */
    .play {
      position:relative; width:100%; max-width:1100px; height:clamp(230px, 46vh, 460px);
      display:flex; align-items:center; justify-content:center;
      background:var(--table); touch-action:none; user-select:none; -webkit-user-select:none;
      outline:none;
    }
    .play:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
    @media (pointer:fine) { .play { cursor:none; } }
    .play canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

    .copy { width:100%; max-width:1100px; display:grid; grid-template-columns:1fr auto; gap:12px 32px; align-items:end; }
    h1 { font-family:var(--pixel); font-weight:normal; font-size:clamp(34px, 4.4vw, 56px); line-height:1.05; letter-spacing:0; }
    .lead { grid-column:1; font-size:16px; color:var(--muted); line-height:1.55; max-width:60ch; }
    .meter { grid-column:2; grid-row:1 / span 2; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .stitches { display:flex; gap:4px; }
    .stitches svg { width:15px; height:15px; display:block; shape-rendering:crispEdges; }
    .stitches rect { fill:var(--line); transition:fill .15s ease; }
    .stitches .on rect { fill:var(--ink); }
    .hint { font-size:13px; color:var(--muted); }

    /* финал: место зарезервировано, чтобы ничего не прыгало */
    .done {
      width:100%; max-width:1100px; display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px;
      min-height:44px; visibility:hidden; opacity:0; transform:translateY(6px);
      transition:opacity .3s ease, transform .3s ease, visibility 0s linear .3s;
    }
    .done.show { visibility:visible; opacity:1; transform:none; transition:opacity .3s ease, transform .3s ease; }
    .done-line { font-family:var(--pixel); font-size:30px; line-height:1.1; margin-right:auto; }
    .links { display:flex; flex-wrap:wrap; gap:10px; }
    .rip-again {
      min-height:44px; padding:0 4px; background:none; border:0; cursor:pointer;
      font:inherit; font-size:14px; color:var(--muted); text-decoration:underline; text-underline-offset:4px;
      transition:color .18s ease;
    }
    .rip-again:hover { color:var(--ink); }

    @media (max-width:700px) {
      .top { padding:12px 16px; }
      .top-logo img { width:96px; }
      main { padding:20px 16px 32px; gap:18px; }
      .play { height:clamp(220px, 34vh, 300px); }
      .copy { grid-template-columns:1fr; }
      .meter { grid-column:1; grid-row:auto; align-items:flex-start; }
      .stitches { flex-wrap:wrap; }
      .done-line { width:100%; }
      .links { width:100%; }
      .links .btn { flex:1 1 auto; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="top-logo" href="/" aria-label="accinthecloud, на главную"><img src="/images/logo.png" alt="accinthecloud" width="240" height="110"></a>
    <a class="btn" href="/">На главную</a>
  </header>

  <main>
    <div class="play" id="play" tabindex="0" role="button"
         aria-label="Разрыв на странице. Нажимай пробел или Enter, чтобы сделать стежок"
         aria-describedby="status">
      <canvas id="cv" aria-hidden="true"></canvas>
    </div>

    <div class="copy">
      <h1>Страница порвалась</h1>
      <p class="lead">Такой страницы нет, тут разошёлся шов. Зашей её иголкой или просто иди на главную.</p>
      <div class="meter">
        <div class="stitches" id="stitches" aria-hidden="true"></div>
        <p class="hint" id="hint">Води иголкой через разрыв туда-обратно. С клавиатуры: пробел</p>
      </div>
    </div>

    <p class="sr-only" id="status" aria-live="polite"></p>

    <div class="done" id="done">
      <p class="done-line">Зашили. Теперь можно дальше</p>
      <nav class="links" aria-label="Куда дальше">
        <a class="btn btn-solid" href="/index.html#capsules">Капсулы</a>
        <a class="btn" href="/lookbook.html">Лукбук</a>
        <a class="btn" href="https://t.me/accinthecloud1" target="_blank" rel="noopener">Telegram-канал</a>
      </nav>
      <button class="rip-again" id="again" type="button">Распороть заново</button>
    </div>
  </main>

<script>
(() => {
  'use strict';

  // ── настройки ──────────────────────────────────────────
  const N = 12;                       // сколько стежков нужно
  const INK = '#0d0d0d', MUTED = '#6b6b6b', TABLE = '#f1f1f1';
  const NEEDLE = '#8f8f8f', FRAY = '#a3a3a3', SEAM = '#c4c4c4', SHADOW = '#d6d6d6';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const coarse = matchMedia('(pointer: coarse)').matches;

  const play = document.getElementById('play');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const doneBox = document.getElementById('done');
  const statusEl = document.getElementById('status');
  const hint = document.getElementById('hint');
  const meter = document.getElementById('stitches');

  if (coarse) hint.textContent = 'Веди пальцем через разрыв туда-обратно';

  // ── полоска прогресса: пиксельные крестики ─────────────
  const crossSvg = '<svg viewBox="0 0 5 5"><rect x="0" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/>' +
    '<rect x="1" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/>' +
    '<rect x="1" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/>' +
    '<rect x="4" y="4" width="1" height="1"/></svg>';
  for (let i = 0; i < N; i++) { const s = document.createElement('span'); s.innerHTML = crossSvg; meter.appendChild(s); }
  const marks = [...meter.children];

  // ── состояние ─────────────────────────────────────────
  let seed = 7;
  let stitches = [];          // { f: доля высоты полотна, dir: 1 слева направо, -1 справа налево }
  let done = false;
  let open = 1, vel = 0;      // 1 — разрыв широкий, 0 — сомкнули
  let P, lw, lh, G0, DY0, sheetL, sheetW, sheetT, sheetB, ripX, spacing;
  let left, right;            // две половинки полотна (свои canvas)
  const needle = { x: 0, y: 0, a: Math.PI + 0.5, active: false };
  let prev = null;            // прошлое положение кончика, чтобы ловить пересечение разрыва
  let revealTimer = 0;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  // ── раскладка: всё рисуем в низком разрешении и растягиваем целым числом ──
  function layout() {
    const r = play.getBoundingClientRect();
    P = Math.max(3, Math.round(r.width / 210));
    lw = Math.floor(r.width / P); lh = Math.floor(r.height / P);
    cv.width = lw; cv.height = lh;
    cv.style.width = lw * P + 'px'; cv.style.height = lh * P + 'px';

    G0 = clamp(Math.round(lw * 0.09), 8, 18);
    DY0 = 3;
    const mx = 6;
    sheetW = lw - mx * 2 - G0;
    sheetL = Math.round((lw - sheetW) / 2);
    sheetT = 5; sheetB = lh - 7;
    const usable = sheetB - sheetT - 8;
    spacing = clamp(Math.floor(usable / (N + 2)), 2, 6);

    // зигзаг разрыва: точки через каждые 4 ряда, между ними по прямой
    const save = seed;
    const center = Math.round(lw / 2);
    const pts = [];
    let sign = 1;
    for (let y = sheetT - 4; y <= sheetB + 8; y += 4) {
      pts.push({ y, x: center + sign * (1 + Math.floor(rand() * 3)) });
      sign = -sign;
    }
    seed = save;
    ripX = new Int16Array(lh + 2);
    for (let y = 0; y < lh + 2; y++) {
      let i = 0;
      while (i < pts.length - 2 && pts[i + 1].y < y) i++;
      const a = pts[i], b = pts[i + 1];
      const t = clamp((y - a.y) / (b.y - a.y), 0, 1);
      ripX[y] = Math.round(a.x + (b.x - a.x) * t);
    }
    buildPieces();
  }

  function newCanvas() { const c = document.createElement('canvas'); c.width = lw; c.height = lh; return c; }

  // полотно-заплатка с надписью 404, потом режем его по зигзагу
  function buildPieces() {
    const base = newCanvas(), b = base.getContext('2d');
    const sh = sheetB - sheetT;
    b.fillStyle = SHADOW; b.fillRect(sheetL + 1, sheetT + 1, sheetW, sh);
    b.fillStyle = '#fff'; b.fillRect(sheetL, sheetT, sheetW, sh);
    b.fillStyle = INK;
    b.fillRect(sheetL, sheetT, sheetW, 1); b.fillRect(sheetL, sheetB - 1, sheetW, 1);
    b.fillRect(sheetL, sheetT, 1, sh); b.fillRect(sheetL + sheetW - 1, sheetT, 1, sh);
    // строчка по краю, как у нашивки
    b.fillStyle = SEAM;
    for (let x = sheetL + 3; x < sheetL + sheetW - 3; x += 4) { b.fillRect(x, sheetT + 3, 2, 1); b.fillRect(x, sheetB - 4, 2, 1); }
    for (let y = sheetT + 3; y < sheetB - 3; y += 4) { b.fillRect(sheetL + 3, y, 1, 2); b.fillRect(sheetL + sheetW - 4, y, 1, 2); }

    // надпись: рисуем шрифтом и убираем полутона, чтобы пиксели были чёткими
    const t = newCanvas(), tc = t.getContext('2d');
    // подбираем кегль по реальному размеру цифр: высота около половины полотна, ширина до 72 %
    let fs = 100;
    tc.font = fs + 'px PixelImpacted, sans-serif';
    let m0 = tc.measureText('404');
    const gh = (m0.actualBoundingBoxAscent + m0.actualBoundingBoxDescent) || fs * 0.7;
    fs = Math.floor(Math.min(fs * sh * 0.5 / gh, fs * sheetW * 0.72 / m0.width));
    tc.font = fs + 'px PixelImpacted, sans-serif';
    const m = tc.measureText('404');
    const asc = m.actualBoundingBoxAscent || fs * 0.7, desc = m.actualBoundingBoxDescent || 0;
    tc.fillStyle = INK; tc.textAlign = 'center'; tc.textBaseline = 'alphabetic';
    tc.fillText('404', Math.round(lw / 2), Math.round(sheetT + sh / 2 + (asc - desc) / 2));
    const img = tc.getImageData(0, 0, lw, lh), d = img.data;
    for (let i = 3; i < d.length; i += 4) {
      const on = d[i] > 110;
      d[i - 3] = 13; d[i - 2] = 13; d[i - 1] = 13; d[i] = on ? 255 : 0;
    }
    tc.putImageData(img, 0, 0);
    b.drawImage(t, 0, 0);

    left = newCanvas(); right = newCanvas();
    const L = left.getContext('2d'), R = right.getContext('2d');
    L.drawImage(base, 0, 0); R.drawImage(base, 0, 0);
    for (let y = 0; y < lh; y++) {
      L.clearRect(ripX[y], y, lw - ripX[y], 1);
      R.clearRect(0, y, ripX[y], 1);
    }
    // рваный край и торчащие нитки
    const save = seed;
    for (let y = sheetT; y < sheetB; y++) {
      const a = ripX[y], p = y > sheetT ? ripX[y - 1] : a;
      const lo = Math.min(a, p), hi = Math.max(a, p);
      L.fillStyle = INK; L.fillRect(lo - 1, y, hi - lo + 1, 1);
      R.fillStyle = INK; R.fillRect(lo, y, hi - lo + 1, 1);
      if (y > sheetT + 1 && y < sheetB - 2) {
        if (rand() < 0.28) { L.fillStyle = FRAY; L.fillRect(a, y, rand() < 0.3 ? 2 : 1, 1); }
        if (rand() < 0.28) { const k = rand() < 0.3 ? 2 : 1; R.fillStyle = FRAY; R.fillRect(a - k, y, k, 1); }
      }
    }
    seed = save;
  }

  // ── пиксельная линия по сетке ──────────────────────────
  // под тёмными пикселями (цифры, край) нитка светлая, иначе её не видно
  let under = null;
  function dark(x, y) {
    if (!under || x < 0 || y < 0 || x >= lw || y >= lh) return false;
    return under[(y * lw + x) * 4] < 90;
  }
  function pline(x0, y0, x1, y1, color) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    ctx.fillStyle = color;
    for (let guard = 0; guard < 2000; guard++) {
      ctx.fillStyle = color === INK && dark(x0, y0) ? '#fff' : color;
      ctx.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  const sheetH = () => sheetB - sheetT;
  const rowOf = f => Math.round(sheetT + f * sheetH());
  function offsets() {
    const g = Math.max(-1.5, G0 * open);
    const half = Math.round(g / 2);
    return { l: -half, r: half, dy: Math.round(DY0 * Math.max(0, open)) };
  }

  // концы стежка: в ткани на 3 пикселя от рваного края
  function stitchEnds(s, o) {
    const y = rowOf(s.f);
    const yl = y - s.dir, yr = y + s.dir;
    return {
      x0: ripX[clamp(yl, 0, lh)] - 4 + o.l, y0: yl,
      x1: ripX[clamp(yr, 0, lh)] + 3 + o.r, y1: yr + o.dy
    };
  }

  // ── кадр ───────────────────────────────────────────────
  function draw(t) {
    ctx.fillStyle = TABLE; ctx.fillRect(0, 0, lw, lh);
    const o = offsets();
    ctx.drawImage(left, o.l, 0);
    ctx.drawImage(right, o.r, o.dy);
    under = ctx.getImageData(0, 0, lw, lh).data;

    let last = null;
    for (const s of stitches) {
      const e = stitchEnds(s, o);
      ctx.fillStyle = MUTED; ctx.fillRect(e.x0, e.y0, 1, 1); ctx.fillRect(e.x1, e.y1, 1, 1);
      pline(e.x0, e.y0, e.x1, e.y1, INK);
      last = s.dir > 0 ? { x: e.x1, y: e.y1 } : { x: e.x0, y: e.y0 };
    }

    // иголка: кончик там, где палец или мышь, ушко сзади
    let nx = needle.x, ny = needle.y, a = needle.a;
    if (!needle.active) {
      nx = Math.round(lw / 2 + G0 * open / 2 + 10);
      ny = Math.round(sheetT + sheetH() * 0.32 + (reduce.matches ? 0 : Math.round(Math.sin(t / 380))));
      a = Math.PI + 0.55;
    }
    const L = 12, bx = -Math.cos(a), by = -Math.sin(a);
    const eye = { x: nx + bx * (L - 2), y: ny + by * (L - 2) };
    // нитка от ушка к последнему стежку (после финала — коротко отрезана)
    if (last && !done) pline(eye.x, eye.y, last.x, last.y, INK);
    else pline(eye.x, eye.y, eye.x + bx * 3, eye.y + 4, INK);
    // тело иголки
    let px = -1, py = -1;
    for (let i = 0; i <= L; i++) {
      const x = Math.round(nx + bx * i), y = Math.round(ny + by * i);
      if (x === px && y === py) continue;
      px = x; py = y;
      if (i === L - 2) continue;              // дырка ушка
      ctx.fillStyle = i === 0 ? MUTED : NEEDLE;
      ctx.fillRect(x, y, 1, 1);
    }
  }

  // ── пружина: половинки подтягиваются друг к другу ─────
  let lastT = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
    const target = done ? 0 : 1 - stitches.length / N * 0.82;
    if (reduce.matches) { open = target; vel = 0; }
    else {
      const k = done ? 520 : 170, c = done ? 17 : 15;
      vel += ((target - open) * k - vel * c) * dt;
      open += vel * dt;
    }
    draw(t);
    requestAnimationFrame(frame);
  }

  // ── стежок ─────────────────────────────────────────────
  function freeAt(y) {
    if (y < sheetT + 4 || y > sheetB - 5) return false;
    return stitches.every(s => Math.abs(rowOf(s.f) - y) >= spacing);
  }

  function addStitch(y, dir) {
    if (done || !freeAt(y)) return false;
    stitches.push({ f: (y - sheetT) / sheetH(), dir });
    if (!reduce.matches) vel -= 0.9;          // рывок нитки
    const n = stitches.length;
    marks.forEach((m, i) => m.classList.toggle('on', i < n));
    statusEl.textContent = 'Стежков: ' + n + ' из ' + N;
    if (n >= N) finish();
    return true;
  }

  function finish() {
    done = true;
    if (!reduce.matches) vel = -2.5;          // защёлкиваем с пружиной
    clearTimeout(revealTimer);
    revealTimer = setTimeout(() => {
      doneBox.classList.add('show');
      statusEl.textContent = 'Зашили. Теперь можно дальше';
    }, reduce.matches ? 0 : 320);
  }

  function reset() {
    seed = Math.floor(Math.random() * 100000) + 1;
    stitches = []; done = false; open = 1; vel = 0; prev = null;
    marks.forEach(m => m.classList.remove('on'));
    doneBox.classList.remove('show');
    statusEl.textContent = 'Распороли. Можно шить заново';
    layout();
  }

  // ── мышь и палец ───────────────────────────────────────
  function toLocal(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / P, y: (e.clientY - r.top) / P };
  }
  function track(e) {
    const p = toLocal(e);
    if (prev) {
      const dx = p.x - prev.x, dy = p.y - prev.y;
      if (dx * dx + dy * dy > 0.15) {
        const want = Math.atan2(dy, dx);
        let diff = want - needle.a;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        needle.a += diff * (reduce.matches ? 1 : 0.35);
      }
      // пересекли разрыв — кладём стежок там, где прошли
      const c0 = ripX[clamp(Math.round(prev.y), 0, lh)], c1 = ripX[clamp(Math.round(p.y), 0, lh)];
      const s0 = prev.x < c0 ? -1 : 1, s1 = p.x < c1 ? -1 : 1;
      if (s0 !== s1 && Math.abs(dx) < lw * 0.6) {
        const c = (c0 + c1) / 2;
        const k = dx === 0 ? 0.5 : clamp((c - prev.x) / dx, 0, 1);
        addStitch(Math.round(prev.y + dy * k), s1);
      }
    }
    prev = p;
    needle.x = Math.round(p.x); needle.y = Math.round(p.y); needle.active = true;
  }

  play.addEventListener('pointerdown', e => {
    prev = null; track(e);
    if (e.pointerType !== 'mouse') play.setPointerCapture(e.pointerId);
  });
  play.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' && e.buttons === 0) return;
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    if (list.length) list.forEach(track); else track(e);
  });
  const leave = () => { prev = null; needle.active = false; };
  play.addEventListener('pointerleave', leave);
  play.addEventListener('pointercancel', leave);
  play.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') leave(); });

  // ── клавиатура: пробел или Enter шьют сами, по стежку ──
  play.addEventListener('keydown', e => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    if (done) return;
    const dir = stitches.length % 2 ? -1 : 1;
    for (let y = sheetT + 4; y <= sheetB - 5; y++) {
      if (freeAt(y)) {
        addStitch(y, dir);
        needle.active = true;
        needle.x = ripX[y] + dir * (Math.round(G0 * open / 2) + 6);
        needle.y = y + 2;
        needle.a = dir > 0 ? 0.35 : Math.PI - 0.35;
        prev = null;
        break;
      }
    }
  });

  document.getElementById('again').addEventListener('click', () => { reset(); play.focus(); });

  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

  // ждём пиксельный шрифт, иначе 404 нарисуется системным
  const start = () => { layout(); requestAnimationFrame(t => { lastT = t; frame(t); }); };
  (document.fonts && document.fonts.load ? document.fonts.load('40px PixelImpacted') : Promise.resolve())
    .catch(() => {}).then(start);
})();
</script>
</body>
</html>
