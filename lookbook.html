<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lookbook — accinthecloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#ffffff; --ink:#0d0d0d; --muted:#909090;
      --border:#ebebeb; --soft:#f5f5f5;
      --serif:'Playfair Display',Georgia,serif;
      --sans:'Inter',-apple-system,sans-serif;
    }
    body { font-family:var(--sans); background:var(--bg); color:var(--ink); overflow-x:hidden; }
    a { text-decoration:none; color:inherit; }

    nav {
      position:sticky; top:0; z-index:200; background:rgba(255,255,255,0.92);
      backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
      padding:20px 48px; display:flex; justify-content:space-between; align-items:center;
    }
    .nav-logo { font-family:var(--serif); font-style:italic; font-size:15px; font-weight:300; }
    .nav-center { display:flex; gap:32px; list-style:none; }
    .nav-center a { font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); transition:color .3s; }
    .nav-center a:hover, .nav-center a.active { color:var(--ink); }
    .nav-right a {
      font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
      padding:8px 16px; border:1px solid var(--border); transition:border-color .2s;
    }
    .nav-right a:hover { border-color:var(--ink); }

    /* GRID */
    .lb-grid {
      columns: 3;
      column-gap: 3px;
      padding: 3px;
    }
    .lb-tile {
      break-inside: avoid;
      margin-bottom: 3px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .lb-tile img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .7s cubic-bezier(.25,.46,.45,.94), opacity .3s;
    }
    .lb-tile:hover img { transform: scale(1.03); opacity: .88; }

    /* MODAL */
    .modal-overlay {
      position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.92);
      opacity:0; pointer-events:none; transition:opacity .3s;
      display:flex; align-items:center; justify-content:center;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }

    .modal {
      display:flex; width:100%; max-width:1200px; height:90dvh;
      transform:translateY(32px); transition:transform .4s cubic-bezier(.25,.46,.45,.94);
      margin:0 24px;
    }
    .modal-overlay.open .modal { transform:translateY(0); }

    /* gallery side */
    .modal-gallery {
      flex:1; position:relative; background:#000; overflow:hidden;
      display:flex; flex-direction:column;
    }
    .modal-slides {
      flex:1; display:flex; overflow-x:auto;
      scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    }
    .modal-slides::-webkit-scrollbar { display:none; }
    .modal-slide { flex:0 0 100%; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; }
    .modal-slide img { max-width:100%; max-height:100%; object-fit:contain; }
    .modal-dots-row {
      display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 16px; background:#000;
    }
    .mdot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.25); cursor:pointer; transition:background .2s; flex-shrink:0; }
    .mdot.active { background:#fff; }
    .marr {
      position:absolute; top:50%; transform:translateY(-50%);
      width:44px; height:44px; border:none; background:rgba(255,255,255,0.1);
      color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background .2s; z-index:2;
    }
    .marr:hover { background:rgba(255,255,255,0.22); }
    #arrPrev { left:12px; }
    #arrNext { right:12px; }

    /* info side */
    .modal-info {
      width:360px; flex-shrink:0; background:#fff;
      display:flex; flex-direction:column; overflow-y:auto;
      padding:44px 36px 36px; position:relative;
    }
    .modal-close {
      position:absolute; top:18px; right:18px;
      width:34px; height:34px; background:none; border:1px solid var(--border);
      cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;
    }
    .modal-num { font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
    .modal-name { font-family:var(--serif); font-size:22px; font-weight:400; line-height:1.3; margin-bottom:22px; }
    .modal-divider { height:1px; background:var(--border); margin-bottom:22px; }
    .modal-text { font-size:13px; color:var(--muted); line-height:1.95; flex:1; white-space:pre-line; }
    .modal-footer { margin-top:36px; }
    .modal-made { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
    .modal-disclaimer {
      font-size:11px; color:var(--muted); line-height:1.7;
      padding:12px 14px; border:1px solid var(--border); margin-bottom:20px;
    }
    .modal-order {
      display:block; width:100%; padding:15px; background:var(--ink); color:#fff;
      border:none; font-family:var(--sans); font-size:11px; letter-spacing:0.2em;
      text-transform:uppercase; cursor:pointer; text-align:center; transition:opacity .3s;
    }
    .modal-order:hover { opacity:.72; }

    footer {
      padding:36px 48px; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center;
    }
    .footer-logo { font-family:var(--serif); font-style:italic; font-size:14px; }
    .footer-links { display:flex; gap:24px; }
    .footer-links a { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); transition:color .3s; }
    .footer-links a:hover { color:var(--ink); }

    @media(max-width:900px) {
      nav { padding:16px 20px; }
      .nav-center { display:none; }
      .lb-grid { columns:2; }
      .modal { flex-direction:column; height:96dvh; margin:0; }
      .modal-info { width:100%; padding:24px 20px; }
      footer { flex-direction:column; gap:16px; text-align:center; }
    }
    @media(max-width:500px) {
      .lb-grid { columns:2; column-gap:2px; padding:2px; }
      .lb-tile { margin-bottom:2px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">accinthecloud</a>
  <ul class="nav-center">
    <li><a href="lookbook.html" class="active">Lookbook</a></li>
    <li><a href="collection-a1.html">a1</a></li>
    <li><a href="collection-a2.html">a2</a></li>
    <li><a href="collection-a3.html">a3</a></li>
  </ul>
  <div class="nav-right"><a href="cart.html">Корзина</a></div>
</nav>

<div class="lb-grid" id="grid"></div>

<footer>
  <span class="footer-logo">accinthecloud</span>
  <div class="footer-links">
    <a href="index.html">Главная</a>
    <a href="https://t.me/accinthecloud1" target="_blank">Telegram</a>
    <a href="https://instagram.com/accinthecloud" target="_blank">Instagram</a>
  </div>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="overlay">
  <div class="modal">
    <div class="modal-gallery">
      <button class="marr" id="arrPrev">&#8592;</button>
      <button class="marr" id="arrNext">&#8594;</button>
      <div class="modal-slides" id="mSlides"></div>
      <div class="modal-dots-row" id="mDots"></div>
    </div>
    <div class="modal-info">
      <button class="modal-close" id="mClose">&#10005;</button>
      <p class="modal-num" id="mNum"></p>
      <h2 class="modal-name" id="mName"></h2>
      <div class="modal-divider"></div>
      <p class="modal-text" id="mText"></p>
      <div class="modal-footer">
        <p class="modal-made">Индивидуальный пошив</p>
        <div class="modal-disclaimer">Точное повторение не гарантируется — материалы, фурнитура и поставки могут отличаться. Каждое изделие создаётся заново под ваши параметры.</div>
        <button class="modal-order" id="mOrderBtn">Заказать похожее →</button>
      </div>
    </div>
  </div>
</div>

<script>
const ITEMS = [
  {
    id: 'raspberry-orbit',
    num: 'no. 17',
    name: "'raspberry orbit' work jacket",
    desc: `Укороченная куртка из плотного канваса с объёмной простёжкой в форме кругов. Материал держит форму и придаёт изделию скульптурный силуэт. Металлическая фурнитура и контрастная отделка добавляют индустриальный характер.`,
    photos: 3,
    folder: 'raspberry-orbit',
  },
  {
    id: 'indigo-line',
    num: 'no. 14 · sample 1',
    name: '«Indigo Line» selvedge denim',
    desc: `Винтаж в чистом виде, переосмысленный с уважением к деталям. Эти джинсы сшиты из японского селвидж денима с характерной красно-белой кромкой и дополнены поясом из плотного канваса, как дань рабочей одежде 1940–50-х годов. Контраст фактур и оттенков отсылает к эпохе, когда каждая вещь служила годами и несла в себе следы истории.\n\nПрямой крой, высокая посадка, классические заклёпки и задний регулировочный ремешок в стиле cinch back. Это выбор тех, кто чувствует связь с прошлым, но живёт в настоящем.`,
    photos: 9,
    folder: 'indigo-line',
  },
  {
    id: 'olive-maverick',
    num: 'no. 18',
    name: "'OLIVE MAVERICK' work jacket",
    desc: ``,
    photos: 6,
    folder: 'olive-maverick',
  },
];

// Build grid — all photos from all items as tiles
const grid = document.getElementById('grid');
ITEMS.forEach(item => {
  for (let i = 1; i <= item.photos; i++) {
    const src = `images/lookbook/${item.folder}/${String(i).padStart(2,'0')}.jpeg`;
    const tile = document.createElement('div');
    tile.className = 'lb-tile';
    tile.innerHTML = `<img src="${src}" loading="lazy" alt="${item.name}">`;
    tile.addEventListener('click', () => openModal(item, i - 1));
    grid.appendChild(tile);
  }
});

// Modal logic
let cur = null, curSlide = 0;
const mSlides = document.getElementById('mSlides');
const mDots   = document.getElementById('mDots');

function openModal(item, startIdx) {
  cur = item;
  curSlide = startIdx;

  mSlides.innerHTML = Array.from({length: item.photos}, (_, i) => {
    const src = `images/lookbook/${item.folder}/${String(i+1).padStart(2,'0')}.jpeg`;
    return `<div class="modal-slide"><img src="${src}" loading="lazy" alt=""></div>`;
  }).join('');

  mDots.innerHTML = Array.from({length: item.photos}, (_, i) =>
    `<div class="mdot${i===startIdx?' active':''}" data-i="${i}"></div>`
  ).join('');

  mDots.querySelectorAll('.mdot').forEach(d =>
    d.addEventListener('click', () => goSlide(+d.dataset.i))
  );

  mSlides.scrollLeft = startIdx * mSlides.offsetWidth;
  mSlides.addEventListener('scroll', onScroll, {passive:true});

  document.getElementById('mNum').textContent = item.num;
  document.getElementById('mName').textContent = item.name;
  document.getElementById('mText').textContent = item.desc || 'Описание скоро появится...';

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function onScroll() {
  const idx = Math.round(mSlides.scrollLeft / mSlides.offsetWidth);
  if (idx !== curSlide) {
    curSlide = idx;
    mDots.querySelectorAll('.mdot').forEach((d,i) => d.classList.toggle('active', i===idx));
  }
}

function goSlide(i) {
  mSlides.scrollTo({left: i * mSlides.offsetWidth, behavior:'smooth'});
}

document.getElementById('arrPrev').addEventListener('click', () => goSlide(Math.max(0, curSlide-1)));
document.getElementById('arrNext').addEventListener('click', () => { if(cur) goSlide(Math.min(cur.photos-1, curSlide+1)); });

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  mSlides.removeEventListener('scroll', onScroll);
}
document.getElementById('mClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => { if(e.target===document.getElementById('overlay')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

document.getElementById('mOrderBtn').addEventListener('click', () => {
  if (!cur) return;
  const ref = encodeURIComponent(cur.name);
  window.location.href = `index.html#order?ref=${ref}`;
});
</script>
</body>
</html>
