<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lookbook — accinthecloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="cart.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#ffffff; --ink:#0d0d0d; --muted:#909090;
      --border:#ebebeb; --soft:#f5f5f5;
      --serif:'Playfair Display',Georgia,serif;
      --sans:'Inter',-apple-system,sans-serif;
    }
    html { scroll-behavior:smooth; }
    body { font-family:var(--sans); background:var(--bg); color:var(--ink); overflow-x:hidden; }
    a { text-decoration:none; color:inherit; }

    /* ── Nav ── */
    nav {
      position:sticky; top:0; z-index:200;
      background:rgba(255,255,255,0.92); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      padding:20px 48px; display:flex; justify-content:space-between; align-items:center;
    }
    .nav-logo { font-family:var(--serif); font-style:italic; font-size:15px; font-weight:300; }
    .nav-center { display:flex; gap:32px; list-style:none; }
    .nav-center a {
      font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
      color:var(--muted); transition:color .3s;
    }
    .nav-center a:hover, .nav-center a.active { color:var(--ink); }
    .nav-right { display:flex; align-items:center; gap:20px; }
    .cart-link {
      position:relative; display:flex; align-items:center; gap:8px;
      font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
      padding:8px 16px; border:1px solid var(--border); transition:all .2s;
    }
    .cart-link:hover { border-color:var(--ink); }
    .cart-badge {
      display:none; position:absolute; top:-6px; right:-6px;
      width:18px; height:18px; background:var(--ink); color:white;
      font-size:10px; border-radius:50%; align-items:center; justify-content:center;
    }

    /* ── Header ── */
    .page-header {
      padding:80px 48px 56px; display:flex; justify-content:space-between; align-items:flex-end;
      border-bottom:1px solid var(--border);
    }
    .breadcrumb { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
    .breadcrumb a { color:var(--muted); transition:color .2s; }
    .breadcrumb a:hover { color:var(--ink); }
    .page-title { font-family:var(--serif); font-size:clamp(40px,7vw,80px); font-weight:400; line-height:1; }
    .page-subtitle { font-size:13px; color:var(--muted); margin-top:12px; line-height:1.7; max-width:400px; }
    .header-right { text-align:right; }
    .work-count { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); }

    /* ── Filter bar ── */
    .filter-bar {
      padding:24px 48px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:0;
    }
    .filter-label { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-right:24px; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; }
    .filter-btn {
      padding:7px 18px; border:1px solid var(--border); font-family:var(--sans);
      font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
      cursor:pointer; background:transparent; color:var(--muted); transition:all .2s;
    }
    .filter-btn:hover { border-color:var(--ink); color:var(--ink); }
    .filter-btn.active { background:var(--ink); color:white; border-color:var(--ink); }

    /* ── Gallery ── */
    .gallery-section { padding:48px 48px 120px; }

    /* Masonry-like grid via CSS columns */
    .masonry {
      columns:3; column-gap:4px;
    }
    .masonry-item {
      break-inside:avoid; margin-bottom:4px;
      position:relative; overflow:hidden; cursor:pointer;
      display:block;
    }
    .masonry-item .ph {
      width:100%; display:block;
      transition:transform .8s cubic-bezier(.25,.46,.45,.94);
    }
    .masonry-item:hover .ph { transform:scale(1.04); }

    /* vary heights */
    .masonry-item:nth-child(3n+1) .ph { aspect-ratio:4/5; }
    .masonry-item:nth-child(3n+2) .ph { aspect-ratio:3/4; }
    .masonry-item:nth-child(3n+3) .ph { aspect-ratio:2/3; }
    .masonry-item:nth-child(5n)   .ph { aspect-ratio:1/1; }
    .masonry-item:nth-child(7n)   .ph { aspect-ratio:4/3; }

    .item-overlay {
      position:absolute; inset:0; background:rgba(0,0,0,0);
      display:flex; flex-direction:column; justify-content:flex-end;
      padding:20px; transition:background .35s;
    }
    .masonry-item:hover .item-overlay { background:rgba(0,0,0,0.35); }
    .item-info {
      transform:translateY(12px); opacity:0;
      transition:all .35s; color:white;
    }
    .masonry-item:hover .item-info { transform:translateY(0); opacity:1; }
    .item-info-name { font-size:14px; margin-bottom:3px; }
    .item-info-tag { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; opacity:.7; }

    /* ── Lightbox ── */
    .lightbox {
      position:fixed; inset:0; z-index:600; background:rgba(0,0,0,0.92);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .35s;
    }
    .lightbox.open { opacity:1; pointer-events:all; }
    .lb-inner {
      position:relative; max-width:80vw; max-height:88vh;
      display:flex; align-items:center; gap:0;
    }
    .lb-img {
      max-width:60vw; max-height:84vh; object-fit:contain;
      background:var(--soft);
    }
    .lb-img .ph { width:480px; max-width:60vw; height:600px; max-height:84vh; }

    .lb-info {
      width:260px; padding:0 0 0 48px; color:white;
    }
    .lb-tag { font-size:9px; letter-spacing:0.28em; text-transform:uppercase; opacity:.5; margin-bottom:12px; }
    .lb-name { font-family:var(--serif); font-size:24px; font-weight:400; line-height:1.2; margin-bottom:12px; }
    .lb-desc { font-size:13px; opacity:.65; line-height:1.75; }

    .lb-close {
      position:absolute; top:-48px; right:0; width:36px; height:36px;
      display:flex; align-items:center; justify-content:center;
      color:white; font-size:20px; cursor:pointer; opacity:.6; transition:opacity .2s;
      background:none; border:none;
    }
    .lb-close:hover { opacity:1; }
    .lb-nav {
      position:absolute; top:50%; transform:translateY(-50%);
      width:44px; height:44px; display:flex; align-items:center; justify-content:center;
      color:white; font-size:20px; cursor:pointer; opacity:.5; transition:opacity .2s;
      background:none; border:none;
    }
    .lb-nav:hover { opacity:1; }
    .lb-prev { left:-64px; }
    .lb-next { right:-64px; }

    .lb-counter {
      position:absolute; bottom:-36px; left:50%; transform:translateX(-50%);
      font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,.4);
    }

    /* ── Footer ── */
    footer {
      padding:40px 48px; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; align-items:center;
    }
    .footer-logo { font-family:var(--serif); font-style:italic; font-size:14px; }
    .footer-links { display:flex; gap:24px; }
    .footer-links a { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); transition:color .3s; }
    .footer-links a:hover { color:var(--ink); }

    /* ── Responsive ── */
    @media(max-width:900px) {
      nav { padding:16px 20px; }
      .nav-center { display:none; }
      .page-header { padding:56px 20px 36px; flex-direction:column; gap:16px; }
      .header-right { text-align:left; }
      .filter-bar { padding:20px; gap:12px; flex-wrap:wrap; }
      .gallery-section { padding:32px 20px 80px; }
      .masonry { columns:2; }
      .lb-inner { flex-direction:column; max-width:92vw; }
      .lb-img .ph { width:92vw; max-width:92vw; height:50vh; }
      .lb-info { width:100%; padding:20px 0 0; }
      .lb-prev { left:-20px; }
      .lb-next { right:-20px; }
      footer { flex-direction:column; gap:16px; text-align:center; }
    }
    @media(max-width:480px) {
      .masonry { columns:1; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <a href="index.html" class="nav-logo">accinthecloud</a>
  <ul class="nav-center">
    <li><a href="lookbook.html" class="active">Lookbook</a></li>
    <li><a href="collection-a1.html">a1</a></li>
    <li><a href="collection-a2.html">a2</a></li>
    <li><a href="collection-a3.html">a3</a></li>
  </ul>
  <div class="nav-right">
    <a href="cart.html" class="cart-link">
      Корзина
      <span class="cart-badge"></span>
    </a>
  </div>
</nav>

<!-- ── HEADER ── -->
<div class="page-header">
  <div>
    <p class="breadcrumb"><a href="index.html">accinthecloud</a> / Lookbook</p>
    <h1 class="page-title">Lookbook</h1>
    <p class="page-subtitle">Индивидуальные заказы и работы вне капсул. Каждая вещь — отдельная история.</p>
  </div>
  <div class="header-right">
    <p class="work-count" id="workCount">— работ</p>
  </div>
</div>

<!-- ── FILTER BAR ── -->
<div class="filter-bar">
  <span class="filter-label">Фильтр</span>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="джинсы">Джинсы</button>
    <button class="filter-btn" data-filter="куртки">Куртки</button>
    <button class="filter-btn" data-filter="штаны">Штаны</button>
    <button class="filter-btn" data-filter="сумки">Сумки</button>
    <button class="filter-btn" data-filter="другое">Другое</button>
  </div>
</div>

<!-- ── GALLERY ── -->
<div class="gallery-section">
  <div class="masonry" id="masonryGrid"></div>
</div>

<!-- ── LIGHTBOX ── -->
<div class="lightbox" id="lightbox">
  <div class="lb-inner">
    <button class="lb-close" id="lbClose">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <div class="lb-img">
      <div class="ph" id="lbImg"></div>
    </div>
    <div class="lb-info">
      <p class="lb-tag" id="lbTag"></p>
      <h2 class="lb-name" id="lbName"></h2>
      <p class="lb-desc" id="lbDesc"></p>
    </div>
    <div class="lb-counter" id="lbCounter"></div>
  </div>
</div>

<!-- ── FOOTER ── -->
<footer>
  <span class="footer-logo">accinthecloud</span>
  <div class="footer-links">
    <a href="index.html">Главная</a>
    <a href="https://t.me/accinthecloud1" target="_blank">Telegram</a>
    <a href="https://instagram.com/accinthecloud" target="_blank">Instagram</a>
  </div>
</footer>

<script>
/*
  ════════════════════════════════════════════
  ДАННЫЕ ЛУКБУКА
  Чтобы добавить фото — замени bg на:
    bg: 'url("images/lb01.jpg") center/cover'
  ════════════════════════════════════════════
*/
const WORKS = [
  {
    id: 'lb-01',
    name: 'Индивидуальные джинсы',
    tag: 'джинсы',
    desc: 'Пошив на заказ. Raw деним, подгонка под параметры клиента, ручные стежки на поясе.',
    bg: 'linear-gradient(145deg,#1a1714,#2e2926)'
  },
  {
    id: 'lb-02',
    name: 'Кастомная куртка',
    tag: 'куртки',
    desc: 'Oversized куртка из канваса. Объёмный силуэт, накладные карманы, авторская фурнитура.',
    bg: 'linear-gradient(145deg,#2a2520,#1e1b18)'
  },
  {
    id: 'lb-03',
    name: 'Широкие брюки',
    tag: 'штаны',
    desc: 'Брюки из японского денима с уплотнением на коленях. Низкая посадка, свободный крой.',
    bg: 'linear-gradient(145deg,#3a3530,#2a2520)'
  },
  {
    id: 'lb-04',
    name: 'Денимная сумка',
    tag: 'сумки',
    desc: 'Кастомный кросс-боди из плотного денима. Ручные стежки, латунные хольнитены.',
    bg: 'linear-gradient(145deg,#111111,#2a2a2a)'
  },
  {
    id: 'lb-05',
    name: 'Рабочая куртка',
    tag: 'куртки',
    desc: 'Куртка в стиле workwear. Деним 14 oz, металлические пуговицы, накладные карманы на груди.',
    bg: 'linear-gradient(145deg,#4a4540,#363228)'
  },
  {
    id: 'lb-06',
    name: 'Зауженные джинсы',
    tag: 'джинсы',
    desc: 'Зауженный силуэт, нестандартная посадка. Японский деним, ручная отстрочка по низу.',
    bg: 'linear-gradient(145deg,#1c2535,#12181f)'
  },
  {
    id: 'lb-07',
    name: 'Летние штаны',
    tag: 'штаны',
    desc: 'Лёгкие брюки из муслина. Эластичный пояс, боковые карманы. Очень дышат.',
    bg: 'linear-gradient(145deg,#c8c2b8,#a8a098)'
  },
  {
    id: 'lb-08',
    name: 'Тоут из канваса',
    tag: 'сумки',
    desc: 'Шопер из плотного канваса. Усиленное дно, двойные ручки, внутренний карман.',
    bg: 'linear-gradient(145deg,#888078,#5a5248)'
  },
  {
    id: 'lb-09',
    name: 'Джинсовая рубашка',
    tag: 'другое',
    desc: 'Оверсайз рубашка из среднеплотного денима. Нагрудные карманы на пуговицах.',
    bg: 'linear-gradient(145deg,#2e2822,#1c1814)'
  },
  {
    id: 'lb-10',
    name: 'Карго-штаны',
    tag: 'штаны',
    desc: 'Широкие карго из смесовой ткани. Шесть карманов, регулируемые манжеты снизу.',
    bg: 'linear-gradient(145deg,#4a4035,#302820)'
  },
  {
    id: 'lb-11',
    name: 'Клёш джинсы',
    tag: 'джинсы',
    desc: 'Расклешённый силуэт от колена. Японский деним, контрастная отстрочка, металлические заклёпки.',
    bg: 'linear-gradient(145deg,#222028,#141218)'
  },
  {
    id: 'lb-12',
    name: 'Мини-сумка',
    tag: 'сумки',
    desc: 'Маленькая сумка-кошелёк из денима и хлопка. Носится на плечо или пояс.',
    bg: 'linear-gradient(145deg,#3a3028,#221c14)'
  },
  {
    id: 'lb-13',
    name: 'Укороченный пиджак',
    tag: 'куртки',
    desc: 'Структурированный пиджак-куртка из плотного хлопка. Укороченный крой, широкие плечи.',
    bg: 'linear-gradient(145deg,#1a1814,#0e0c0a)'
  },
  {
    id: 'lb-14',
    name: 'Шорты с карманами',
    tag: 'штаны',
    desc: 'Широкие шорты до колена. Сырой деним, большие боковые карманы, металлические пуговицы.',
    bg: 'linear-gradient(145deg,#5a5248,#383028)'
  },
  {
    id: 'lb-15',
    name: 'Кард-холдер',
    tag: 'другое',
    desc: 'Кард-холдер с ручными стежками. Деним + японский хлопок. До 8 карт.',
    bg: 'linear-gradient(145deg,#282420,#181410)'
  },
];

/* ── Render ── */
let currentFilter = 'all';
let currentIndex  = 0;
let filteredWorks = [...WORKS];

const grid = document.getElementById('masonryGrid');

function renderGrid(filter) {
  currentFilter = filter;
  filteredWorks = filter === 'all' ? WORKS : WORKS.filter(w => w.tag === filter);
  document.getElementById('workCount').textContent = filteredWorks.length + ' ' + plural(filteredWorks.length,'работа','работы','работ');

  grid.innerHTML = '';
  filteredWorks.forEach((w, i) => {
    const item = document.createElement('div');
    item.className = 'masonry-item';
    item.dataset.index = i;
    item.innerHTML = `
      <div class="ph" style="background:${w.bg};"></div>
      <div class="item-overlay">
        <div class="item-info">
          <p class="item-info-name">${w.name}</p>
          <p class="item-info-tag">${w.tag}</p>
        </div>
      </div>`;
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });

  // GSAP
  gsap.fromTo('.masonry-item',
    { opacity:0, y:24 },
    { opacity:1, y:0, duration:.6, stagger:.04, ease:'power2.out' }
  );
}

/* ── Filters ── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(btn.dataset.filter);
  });
});

/* ── Lightbox ── */
function openLightbox(index) {
  currentIndex = index;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function updateLightbox() {
  const w = filteredWorks[currentIndex];
  document.getElementById('lbImg').style.background = w.bg;
  document.getElementById('lbTag').textContent = w.tag;
  document.getElementById('lbName').textContent = w.name;
  document.getElementById('lbDesc').textContent = w.desc;
  document.getElementById('lbCounter').textContent = (currentIndex+1) + ' / ' + filteredWorks.length;
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});
document.getElementById('lbPrev').addEventListener('click', e => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + filteredWorks.length) % filteredWorks.length;
  updateLightbox();
});
document.getElementById('lbNext').addEventListener('click', e => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % filteredWorks.length;
  updateLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft')   { currentIndex = (currentIndex-1+filteredWorks.length)%filteredWorks.length; updateLightbox(); }
  if (e.key === 'ArrowRight')  { currentIndex = (currentIndex+1)%filteredWorks.length; updateLightbox(); }
});

/* ── Touch swipe ── */
let tsX = 0;
document.getElementById('lightbox').addEventListener('touchstart', e => { tsX = e.touches[0].clientX; });
document.getElementById('lightbox').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tsX;
  if (Math.abs(dx) < 40) return;
  if (dx < 0) { currentIndex = (currentIndex+1)%filteredWorks.length; }
  else        { currentIndex = (currentIndex-1+filteredWorks.length)%filteredWorks.length; }
  updateLightbox();
});

/* ── Helpers ── */
function plural(n, one, few, many) {
  const m = Math.abs(n) % 100;
  if (m >= 11 && m <= 19) return many;
  const d = m % 10;
  if (d === 1) return one;
  if (d >= 2 && d <= 4) return few;
  return many;
}

gsap.registerPlugin(ScrollTrigger);
renderGrid('all');
</script>
</body>
</html>
